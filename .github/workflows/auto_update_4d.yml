name: Auto Update 4D

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC (J+1 = yesterday's races)
  # Declenchement par commit : la cle API de session n'a pas le droit de poster
  # un workflow_dispatch (403 « Resource not accessible by integration »), donc
  # un run hors planning dependait d'un clic manuel. Toucher ce fichier suffit
  # maintenant a lancer un rattrapage, dates comprises.
  push:
    branches: [main]
    paths:
      - 'update_4d_request.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, default: yesterday)'
        required: false
        default: ''
      date_from:
        description: 'Backfill: premiere date de la plage (YYYY-MM-DD). Prioritaire sur "date".'
        required: false
        default: ''
      date_to:
        description: 'Backfill: derniere date de la plage (YYYY-MM-DD, defaut: hier)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Configure Git
        run: |
          git config user.name "DataPace Bot"
          git config user.email "bot@datapace.fr"

      - name: Run Auto Update 4D
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_FROM: ${{ github.event.inputs.date_from }}
          IN_TO: ${{ github.event.inputs.date_to }}
        run: |
          # Sur un push de update_4d_request.json, les dates viennent du fichier
          if [ "${{ github.event_name }}" = "push" ] && [ -f update_4d_request.json ]; then
            IN_DATE=$(python -c "import json;print(json.load(open('update_4d_request.json')).get('date') or '')")
            IN_FROM=$(python -c "import json;print(json.load(open('update_4d_request.json')).get('date_from') or '')")
            IN_TO=$(python -c "import json;print(json.load(open('update_4d_request.json')).get('date_to') or '')")
            echo "Requete par commit: date='$IN_DATE' from='$IN_FROM' to='$IN_TO'"
          fi
          if [ -n "$IN_FROM" ]; then
            if [ -n "$IN_TO" ]; then
              python auto_update_4d.py --from "$IN_FROM" --to "$IN_TO"
            else
              python auto_update_4d.py --from "$IN_FROM"
            fi
          elif [ -n "$IN_DATE" ]; then
            python auto_update_4d.py --date "$IN_DATE"
          else
            python auto_update_4d.py
          fi

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-4d-log
          path: logs/*.json
          retention-days: 30
